<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HANDMADE | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="dashboard.js" defer></script>
    <style>
      :root {
        --bg: #f6f0e7;
        --panel: #fffdfb;
        --ink: #2d241d;
        --muted: #75685e;
        --line: #e8ddd0;
        --accent: #b96e5d;
        --olive: #354035;
        --success: #3b7d4a;
        --warning: #c77c39;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "DM Sans", sans-serif;
      }
      a { color: inherit; text-decoration: none; }
      button, input, textarea, select {
        font: inherit;
      }
      .hidden { display: none !important; }
      .auth-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .auth-card {
        width: min(420px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 30px 26px;
        box-shadow: 0 20px 40px rgba(45, 36, 29, 0.06);
      }
      .auth-card h1 {
        margin: 0 0 8px;
        font-family: "Playfair Display", serif;
        font-size: 38px;
      }
      .auth-card p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      .auth-form {
        display: grid;
        gap: 14px;
      }
      .field {
        display: grid;
        gap: 7px;
      }
      .field label {
        font-size: 11px;
        color: var(--muted);
      }
      .field input {
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #fff;
      }
      .primary-btn {
        border: none;
        border-radius: 999px;
        background: var(--ink);
        color: #fff;
        padding: 12px 18px;
        cursor: pointer;
        font-weight: 700;
      }
      .secondary-btn {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        border-radius: 999px;
        padding: 10px 14px;
        cursor: pointer;
      }
      .message {
        min-height: 20px;
        margin-top: 12px;
        font-size: 12px;
      }
      .message.error { color: #b94242; }
      .message.success { color: var(--success); }
      .dashboard {
        min-height: 100vh;
        padding: 28px clamp(18px, 4vw, 48px) 48px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
      }
      .brand-mark {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--ink);
        color: #fff;
        display: grid;
        place-items: center;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
        margin-bottom: 26px;
      }
      .stat-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px 16px;
      }
      .stat-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
      }
      .stat-value {
        margin-top: 10px;
        font-size: 28px;
        font-family: "Playfair Display", serif;
      }
      .panel-grid {
        display: grid;
        grid-template-columns: 1.3fr 0.7fr;
        gap: 20px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 20px;
      }
      .panel h2 {
        margin: 0 0 18px;
        font-size: 20px;
        font-family: "Playfair Display", serif;
      }
      .product-form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .product-form .wide { grid-column: 1 / -1; }
      .product-form input,
      .product-form select,
      .product-form textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        padding: 10px 12px;
      }
      .invoice-form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .invoice-form input,
      .invoice-form select,
      .invoice-form textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        padding: 10px 12px;
      }
      .invoice-form .wide { grid-column: 1 / -1; }
      .invoice-items {
        display: grid;
        gap: 10px;
      }
      .invoice-item-row {
        display: grid;
        grid-template-columns: 1.1fr 1.4fr 0.7fr 0.6fr auto;
        gap: 8px;
        align-items: end;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      .invoice-total-preview {
        display: flex;
        justify-content: space-between;
        font-weight: 700;
        padding: 12px 0;
        border-top: 1px solid var(--line);
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        text-align: left;
        padding: 12px 10px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      th {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .product-image {
        width: 52px;
        height: 52px;
        object-fit: cover;
        border-radius: 10px;
      }
      .inventory-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .stock-input {
        width: 64px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 6px;
        background: #fff;
      }
      .table-action {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 8px;
        background: #fff;
        cursor: pointer;
        font-size: 10px;
      }
      .table-action.delete {
        border-color: #e3b4aa;
        color: #a84d40;
      }
      .badge {
        display: inline-block;
        border-radius: 999px;
        padding: 6px 8px;
        font-size: 10px;
        font-weight: 700;
        background: rgba(59, 125, 74, 0.12);
        color: var(--success);
      }
      .badge.pending {
        background: rgba(199, 124, 57, 0.12);
        color: var(--warning);
      }
      .orders-list {
        display: grid;
        gap: 12px;
      }
      .order-card {
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
      }
      .order-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }
      .order-meta {
        color: var(--muted);
        font-size: 11px;
        margin-top: 8px;
      }
      .order-items {
        margin: 12px 0 0;
        padding: 10px 12px;
        background: #faf5ee;
        border-radius: 10px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.7;
      }
      .order-status {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 8px;
        background: #fff;
        color: var(--ink);
        font-size: 10px;
      }
      .custom-request-image {
        width: 96px;
        height: 76px;
        object-fit: cover;
        border-radius: 10px;
        margin-top: 12px;
      }
      .custom-request-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
      }
      .custom-request-details {
        display: grid;
        gap: 3px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.6;
        margin-top: 10px;
      }
      .review-admin-stars {
        color: #c76c27;
        letter-spacing: 2px;
        font-size: 13px;
        margin-top: 10px;
      }
      .empty-state {
        color: var(--muted);
        font-size: 12px;
        padding: 16px 0;
      }
      @media (max-width: 820px) {
        .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .panel-grid { grid-template-columns: 1fr; }
        .product-form { grid-template-columns: 1fr; }
        .invoice-item-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 600px) {
        .dashboard { padding: 16px 10px 30px; }
        .topbar { align-items: flex-start; gap: 12px; }
        .brand { font-size: 13px; }
        .secondary-btn { padding: 8px 10px; font-size: 11px; }
        .stats { gap: 8px; margin-bottom: 14px; }
        .stat-card { padding: 13px 10px; border-radius: 14px; }
        .stat-label { font-size: 8px; letter-spacing: 0.06em; }
        .stat-value { margin-top: 7px; font-size: 22px; }
        .panel { padding: 14px 12px; border-radius: 16px; }
        .panel h2 { font-size: 18px; margin-bottom: 14px; }
        .product-form { gap: 10px; }
        .invoice-form { grid-template-columns: 1fr; gap: 10px; }
        .invoice-form .wide { grid-column: auto; }
        .invoice-item-row { grid-template-columns: 1fr; }
        .table-wrap { margin: 0 -4px; }
        th, td { padding: 10px 7px; font-size: 10px; white-space: nowrap; }
        .product-image { width: 42px; height: 42px; }
        .order-head { align-items: flex-start; }
        .order-card { padding: 11px; }
        .order-status { max-width: 110px; }
        .custom-request-actions { flex-wrap: wrap; }
        .table-action { min-height: 32px; }
      }
    </style>
  </head>
  <body>
    <div class="auth-shell" id="auth-shell">
      <div class="auth-card">
        <h1>HANDMADE</h1>
        <p>الدخول إلى لوحة التحكم</p>
        <form id="login-form" class="auth-form">
          <div class="field">
            <label for="email">البريد الإلكتروني</label>
            <input id="email" name="email" type="email" placeholder="البريد الإلكتروني لحساب الإدارة" required />
          </div>
          <div class="field">
            <label for="password">كلمة المرور</label>
            <input id="password" name="password" type="password" placeholder="كلمة المرور" required />
          </div>
          <button class="primary-btn" type="submit">تسجيل الدخول</button>
        </form>
        <div id="auth-message" class="message"></div>
      </div>
    </div>

    <div class="dashboard hidden" id="dashboard-app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">H</span>
          <span>لوحة تحكم HANDMADE</span>
        </div>
        <button class="secondary-btn" id="logout-btn" type="button">تسجيل الخروج</button>
      </header>

      <section class="stats">
        <div class="stat-card">
          <span class="stat-label">المنتجات</span>
          <div class="stat-value" id="product-count">0</div>
        </div>
        <div class="stat-card">
          <span class="stat-label">الطلبات</span>
          <div class="stat-value" id="order-count">0</div>
        </div>
        <div class="stat-card">
          <span class="stat-label">الإيرادات</span>
          <div class="stat-value" id="revenue-total">EGP 0</div>
        </div>
        <div class="stat-card">
          <span class="stat-label">المخزون</span>
          <div class="stat-value" id="stock-total">0</div>
        </div>
      </section>

      <section class="panel" style="margin-bottom: 20px;">
        <h2>إنشاء فاتورة</h2>
        <form id="invoice-form" class="invoice-form">
          <div class="field">
            <label for="invoice-customer-name">اسم العميل</label>
            <input id="invoice-customer-name" name="customer_name" type="text" required />
          </div>
          <div class="field">
            <label for="invoice-customer-phone">رقم الهاتف</label>
            <input id="invoice-customer-phone" name="phone" type="tel" />
          </div>
          <div class="field wide">
            <label>بنود الفاتورة</label>
            <div id="invoice-items" class="invoice-items"></div>
            <button class="secondary-btn" id="add-invoice-item" type="button" style="margin-top: 10px;">إضافة بند</button>
          </div>
          <div class="invoice-total-preview wide">
            <span>الإجمالي</span>
            <span id="invoice-total">0 جنيه</span>
          </div>
          <div class="field wide">
            <label for="invoice-notes">ملاحظات</label>
            <textarea id="invoice-notes" name="notes" rows="2"></textarea>
          </div>
          <div class="wide">
            <button class="primary-btn" id="save-invoice" type="submit">حفظ الفاتورة</button>
            <p id="invoice-message" class="message" aria-live="polite"></p>
          </div>
        </form>
      </section>

      <main class="panel-grid">
        <section class="panel">
          <h2>إضافة منتج</h2>
          <form id="product-form" class="product-form">
            <div class="field wide">
              <label for="product-name">اسم المنتج بالإنجليزية</label>
              <input id="product-name" name="name" type="text" placeholder="Crochet Flower Bag" required />
            </div>
            <div class="field">
              <label for="product-name-ar">اسم المنتج بالعربية</label>
              <input id="product-name-ar" name="name_ar" type="text" placeholder="حقيبة كروشيه" />
            </div>
            <div class="field">
              <label for="product-category">التصنيف</label>
              <select id="product-category" name="category">
                <option value="Crochet">كروشيه</option>
                <option value="Beadwork">مشغولات خرز</option>
                <option value="Keychains">ميداليات</option>
                <option value="Custom Orders">طلبات خاصة</option>
              </select>
            </div>
            <div class="field">
              <label for="product-price">السعر</label>
              <input id="product-price" name="price" type="number" min="0" step="1" value="250" required />
            </div>
            <div class="field">
              <label for="product-stock">الكمية المتاحة</label>
              <input id="product-stock" name="stock" type="number" min="0" step="1" value="10" required />
            </div>
            <div class="field">
              <label for="product-image">رابط الصورة</label>
              <input id="product-image" name="image" type="url" placeholder="https://..." required />
            </div>
            <div class="field wide">
              <label for="product-extra-images">روابط صور إضافية (افصل بينها بفاصلة أو سطر جديد)</label>
              <textarea id="product-extra-images" name="images" rows="2" placeholder="https://...&#10;https://..."></textarea>
            </div>
            <div class="field wide">
              <label for="product-description">الوصف</label>
              <textarea id="product-description" name="description" rows="3" placeholder="Short description"></textarea>
            </div>
            <div class="wide">
              <button class="primary-btn" type="submit">حفظ المنتج</button>
            </div>
          </form>
        </section>

        <section class="panel">
          <h2>الطلبات</h2>
          <div id="orders-list" class="orders-list"></div>
        </section>
      </main>

      <section class="panel" style="margin-top: 20px;">
        <h2>Inventory</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>المنتج</th>
                <th>التصنيف</th>
                <th>السعر</th>
                <th>المخزون</th>
                <th>الحالة</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody id="products-table"></tbody>
          </table>
        </div>
      </section>
      <section class="panel" style="margin-top: 20px;">
        <h2>طلبات خاصة</h2>
        <div id="custom-requests-list" class="orders-list"></div>
      </section>
      <section class="panel" style="margin-top: 20px;">
        <h2>آراء العملاء</h2>
        <div id="reviews-list" class="orders-list"></div>
      </section>
    </div>
  </body>
</html>
